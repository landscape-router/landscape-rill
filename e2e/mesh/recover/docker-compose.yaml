# mesh e2e recover 场景：注册响应丢失 → 退避重连 → 挑战恢复（REQ-056/057）
# coord（env 注入丢弃首个 REGISTER_RESPONSE）+ node-a（一次性 key，先启动）
# + node-b（reusable，profile late 后启动——保证首个注册是 node-a，确定性触发注入）
# 子网 192.168.242.0/24
services:
  coord:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: mesh-coord
    environment:
      - RILL_E2E_DROP_FIRST_REGISTER_RESPONSE=1
    volumes:
      - ../../build/coord.json:/etc/landscape/overlay.json
    networks:
      mesh:
        ipv4_address: 192.168.242.10

  node-a:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: mesh-node-a
    privileged: true
    devices:
      - /dev/net/tun
    cap_add: [NET_ADMIN, NET_RAW]
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "0"
      net.ipv6.conf.default.disable_ipv6: "0"
    volumes:
      - ../../build/node-a.json:/etc/landscape/overlay.json
    networks:
      mesh:
        ipv4_address: 192.168.242.11

  node-b:
    profiles: ["late"]
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: mesh-node-b
    environment:
      - RUST_LOG=debug
    privileged: true
    devices:
      - /dev/net/tun
    cap_add: [NET_ADMIN, NET_RAW]
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "0"
      net.ipv6.conf.default.disable_ipv6: "0"
    volumes:
      - ../../build/node-b.json:/etc/landscape/overlay.json
    networks:
      mesh:
        ipv4_address: 192.168.242.21

networks:
  mesh:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.242.0/24
