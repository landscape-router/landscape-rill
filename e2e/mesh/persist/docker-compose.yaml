# mesh e2e persist 场景：coordinator 持久化（REQ-037，CONTROL_PLANE §4.1）
# coord + node-a/b/c/d（同一 bridge 网 192.168.240.0/24）
# 场景：node-c 用一次性 auth key 注册（消费）→ 重启 coord（存储文件在容器内保留）
#       → node-a/b/c 自动重连恢复（node-c 走挑战流程，不重新注册）
#       → node-d 复用同一一次性 key 必须被拒（消费状态已持久化）
# node-d 用 compose profile（late）门控：setup 阶段不启动，重启断言阶段再拉起
services:
  coord:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: mesh-coord
    volumes:
      - ../../build/coord.json:/etc/landscape/overlay.json
    networks:
      mesh:
        ipv4_address: 192.168.240.10

  node-a:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: mesh-node-a
    privileged: true
    devices:
      - /dev/net/tun
    cap_add: [NET_ADMIN, NET_RAW]
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "0"
      net.ipv6.conf.default.disable_ipv6: "0"
    volumes:
      - ../../build/node-a.json:/etc/landscape/overlay.json
    networks:
      mesh:
        ipv4_address: 192.168.240.11

  node-b:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: mesh-node-b
    privileged: true
    devices:
      - /dev/net/tun
    cap_add: [NET_ADMIN, NET_RAW]
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "0"
      net.ipv6.conf.default.disable_ipv6: "0"
    volumes:
      - ../../build/node-b.json:/etc/landscape/overlay.json
    networks:
      mesh:
        ipv4_address: 192.168.240.21

  node-c:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: mesh-node-c
    privileged: true
    devices:
      - /dev/net/tun
    cap_add: [NET_ADMIN, NET_RAW]
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "0"
      net.ipv6.conf.default.disable_ipv6: "0"
    volumes:
      - ../../build/node-c.json:/etc/landscape/overlay.json
    networks:
      mesh:
        ipv4_address: 192.168.240.31

  node-d:
    # 复用 node-c 的一次性 auth key：重启后必须注册失败（消费已持久化）
    profiles: ["late"]
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: mesh-node-d
    privileged: true
    devices:
      - /dev/net/tun
    cap_add: [NET_ADMIN, NET_RAW]
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "0"
      net.ipv6.conf.default.disable_ipv6: "0"
    volumes:
      - ../../build/node-d.json:/etc/landscape/overlay.json
    networks:
      mesh:
        ipv4_address: 192.168.240.41

networks:
  mesh:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.240.0/24
