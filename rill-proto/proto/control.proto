syntax = "proto3";

package control;

// landscape-rill mesh 控制面消息（CONTROL_PLANE §3 语义级 → 字段级）
// 生成方式：build.rs + pb-rs → src/core/wire/control.rs（生成物禁手改）
// 传输包络（实现级）：TLS 之上 = 4B 大端消息长度 + Envelope（msg_type + body）

// 控制面消息类型（Envelope.msg_type）
enum MsgType {
  REGISTER = 0;
  REGISTER_RESPONSE = 1;
  NETMAP_PUSH = 2;
  KEY_DIST = 3;
  HEARTBEAT = 4;
  LEASE = 5;
  REVOKE = 6;
  LEADER_REDIRECT = 7;
  CHALLENGE = 8;
  CHALLENGE_ACK = 9;
  ENDPOINT_REPORT = 10;
  PATH_REQUEST = 11;
  PATH_RESPONSE = 12;
  PATH_UPDATE = 13;
  PATH_WITHDRAW = 14;
  PATH_PROBE = 15;
  PATH_PROBE_RESPONSE = 16;
  AUDIT_REQUEST = 17;           // §3.16 签发溯源交叉验证（REQ-049②/REQ-070 阶段三）
  AUDIT_RESPONSE = 18;
}

message Envelope {
  MsgType msg_type = 1;
  bytes body = 2;  // 具体消息的 protobuf 编码
}

// 能力位（位掩码，CONTROL_PLANE §3.1 能力位表）：
//   relay=0x01  bridge=0x02  coordinator=0x04  exit=0x08
//   broadcast=0x20（接收 L2 广播/组播泛洪，opt-in——keydist 仅向该位节点下发 broadcast_key）
//   acl=0x40（支持 ACL 策略裁决，REQ-045：网络开启 ACL 后无该位注册被拒）

// §3.1 注册
message RegisterRequest {
  string auth_key = 1;          // 预授权密钥（一次性/可复用，生成时绑定网络）
  bytes static_pubkey = 2;      // Noise 静态公钥（32B）
  uint32 capabilities = 3;      // 能力位掩码
  uint32 protocol_version = 4;  // 版本协商（§2 首消息协商）
  string hostname = 5;          // 可选元数据
  string os = 6;                // 可选元数据
  repeated string routes = 7;   // 前缀公告（CIDR，§3.8）
  string version = 8;           // 构建版本元数据（可选，CARGO_PKG_VERSION；REQ-052）
}

message RegisterResponse {
  fixed32 node_id = 1;          // coordinator 唯一分配
  fixed32 network_id = 2;       // 本网络标识（联邦钩子，v1 恒为本地网络）
  bytes identity_binding = 3;   // coordinator 签名（§6 binding v2：签域 + node_id + static_pubkey + log 锚点）
  fixed64 raft_log_index = 4;   // 签发日志锚点（REQ-049②）：该注册 apply 的日志位
  fixed64 raft_term = 5;        // 日志锚点任期
}

// §3.6 主重定向（Raft 期）：follower 对 REGISTER/HEARTBEAT 及写请求以此应答，
// 节点收到即重连 leader_endpoint（空 = 选主中，退避重试）
message LeaderRedirect {
  string leader_endpoint = 1;   // 当前主 coordinator 地址
  uint64 raft_term = 2;
}

// §3.2 全网拓扑
message NetmapEntry {
  fixed32 node_id = 1;
  fixed32 network_id = 2;       // 联邦场景高 8 位 = 网络号
  bytes static_pubkey = 3;
  repeated string endpoints = 4;  // UDP 端点 "ip:port"
  uint32 capabilities = 5;
  repeated string routes = 6;   // 前缀公告（CIDR，§3.8）
  uint32 protocol_version = 7;  // 协议版本（v2 路径服务协商；v1 节点 = 1）
  bool offline = 8;             // 可达性标记（CTL-11）：租约超时 = true，节点侧路由表据此撤销其公告
  bytes identity_binding = 9;   // 该节点身份绑定（§6 binding v2，随注册表下发；节点间握手交叉验证用）
  fixed64 raft_log_index = 10;  // 签发日志锚点（REQ-049②）
  fixed64 raft_term = 11;
}

message NetmapPush {
  uint64 version = 1;           // 权威版本号（CAS 语义；同时承载 ACL 策略版本）
  repeated NetmapEntry entries = 2;
  repeated fixed32 relay_roster = 3;  // 激活中继有序名单（REQ-062：node_id 序 = 挂靠优先级；端点查条目）
  AclPolicy acl = 4;            // 网络级 ACL 策略（REQ-045；缺省 = 未启用，v1 全放行）
  repeated string replica_endpoints = 5;  // raft 成员端点（§3.16 审计目标；单机 = 空）
}

// §3.10 ACL 策略（REQ-045，前缀级先行）
message AclPolicy {
  bool enabled = 1;             // false = v1 全放行；true = default-deny
  repeated AclRule rules = 2;   // 有序规则，first-match-wins
  repeated AclGroup groups = 3; // 组 = 管理面标签（node_id 打标，规则引用）
}

message AclRule {
  repeated string subjects = 1;  // "node:<id>" | "group:<name>" | "any"
  string prefix = 2;             // 目标前缀（CIDR）
  bool deny = 3;                 // false = allow（proto3 无三态，缺省 allow）
}

message AclGroup {
  string name = 1;
  bytes node_ids = 2;           // 有序成员，每个 node_id 4B 大端（同 CandidatePath.hops 惯例；
                                // 规避 pb 读侧 packed-fixed 对齐 UB）
}

// §3.3 转发密钥下发
message KeyDist {
  fixed32 to_node_id = 1;
  bytes key = 2;                // key_dst（32B，派生自网络主密钥）
  uint32 key_version = 3;       // 轮换语义：新版本 → 宽限期 → 旧版本过期
  bytes broadcast_key = 4;      // KDF(主密钥, 0xFFFFFFFF)，广播（FRAME_HEADER §2.6）；仅当接收节点能力位含 broadcast（0x20）时携带，未 opt-in 不填充
}

// §3.4 心跳与租约
message Heartbeat {
  TelemetryPayload telemetry = 1;  // 可选遥测载荷（REQ-052，旧节点省略=默认值）
}

// §3.15 遥测（REQ-052）：区间计数（上报即清零）+ 直连确认对
message TelemetryPeer {
  fixed32 node_id = 1;
  uint64 tx_frames = 2;
  uint64 tx_bytes = 3;
  uint64 rx_frames = 4;
  uint64 rx_bytes = 5;
}

message DirectPair {
  fixed32 node_id = 1;
  string endpoint = 2;  // 数据面 UDP 地址
  uint32 rtt_ms = 3;
}

message TelemetryPayload {
  repeated TelemetryPeer peers = 1;   // 数据面 per-peer 流量（单播转发）
  uint64 drop_global = 2;             // 未能归因到 peer 的丢帧
  repeated TelemetryDrop drops = 3;   // per-peer 丢帧归因
  repeated DirectPair direct = 4;     // PONG 确认的直连对（端点 + RTT）
  repeated PathStatEntry paths = 5;   // per-path_id 路径质量桶（REQ-064，区间值）
}

message TelemetryDrop {
  fixed32 node_id = 1;  // 0 = 会话/解析层错误，无明确对端
  uint64 count = 2;
}

// §3.15 per-path 质量桶（REQ-064）：接收侧按 (peer, path_id) 分桶的区间值
message PathStatEntry {
  fixed32 node_id = 1;        // 目标节点（peer）
  fixed64 path_id = 2;        // 0 = 默认路径桶
  uint64 frames = 3;          // 本区间收帧数
  uint64 gap_missing = 4;     // 丢失 seq 单元估计（前向 seq 跳越）
  uint64 reorder = 5;         // 乱序到达计数（回退 seq，非重放）
  uint32 rtt_ms = 6;          // 最近 PATH_PROBE RTT（0 = 未测）
}

message Lease {
  bool granted = 1;
  uint64 expires_at = 2;        // 租约到期时间戳
}

// §3.5 吊销
message Revoke {
  fixed32 node_id = 1;          // 吊销对象；本地吊销列表拒绝握手/流量
}

// §3.9 重连认证（X25519 静态密钥 DH 挑战）
message Challenge {
  bytes eph_pub = 1;            // coordinator 一次性临时 X25519 公钥（32B）
  bytes nonce = 2;              // 随机值（16B）
  uint64 issued_at = 3;         // 服务端校验时间窗口（防重放）
  fixed32 node_id = 4;          // REQ-057：服务端解析的身份；注册响应丢失恢复场景客户端据此计算 tag
}

message ChallengeAck {
  fixed32 node_id = 1;
  bytes tag = 2;                // HMAC（32B）：HKDF-SHA256(X25519(静态私钥, eph_pub), salt=nonce, info="challenge")
}

// §3.2 端点上报（数据面 UDP 地址；注册后/地址变化时上报，随心跳周期广播进 netmap）。
// 分列上报（REQ-062）：本地接口地址（公网准入判定基准）与 echo 回显 seen 地址
// （coordinator 视角观察值）——seen ∈ 本地 = 直连公网，否则 NAT 后（relay 准入排除）
message EndpointReport {
  repeated string endpoints = 1;  // 本地接口 "ip:port"
  repeated string seen = 2;       // echo 回显地址 "ip:port"（可空）
}

// §3.11 路径服务（v1.5 控制面引入 / v2 数据面生效，REQ-034）
// PathRequest：节点 → coordinator，请求本节点 → 目标节点的候选路径集
message PathRequest {
  fixed32 destination_node_id = 1;
  uint32 max_candidates = 2;    // 请求候选路径数（2~4，缺省 4）
}

// PathResponse：coordinator → 节点，候选路径集（含 key_path 签发，只发路径参与者）
message PathResponse {
  fixed32 destination_node_id = 1;
  repeated CandidatePath candidates = 2;
  uint64 path_version = 3;      // 该目标路径集版本
  fixed32 source_node_id = 4;   // 路径发起方（= 请求方，响应必然可写发送路径表）
}

message CandidatePath {
  uint64 path_id = 1;
  uint32 path_epoch = 2;
  bytes hops = 3;               // 有序跳，每个 node_id 4B 大端（首跳 = 发送端点；direct = [目的]）
  uint64 expires_at = 4;        // unix 秒
  bytes key_path = 5;           // KDF(主密钥, path_id, path_epoch)，按路径签发
}

// PathUpdate：coordinator → 节点，路径集变更（拓扑/健康，path_version++，全量替换）
message PathUpdate {
  fixed32 destination_node_id = 1;
  repeated CandidatePath candidates = 2;
  uint64 path_version = 3;
  fixed32 source_node_id = 4;  // 路径发起方（节点端：仅 source=自己 时写入发送路径表）
}

// PathWithdraw：coordinator → 节点，路径撤销（吊销/过期/联邦取消）
message PathWithdraw {
  fixed32 destination_node_id = 1;
  uint64 path_id = 2;
  uint64 path_version = 3;
}

// PathProbe / PathProbeResponse：节点 ↔ 节点，路径活性/健康探测
message PathProbe {
  uint64 path_id = 1;
  uint64 nonce = 2;
  uint64 issued_at = 3;
}

message PathProbeResponse {
  uint64 path_id = 1;
  uint64 nonce = 2;
}

// §3.16 签发溯源交叉验证（REQ-049②/REQ-070 阶段三，split-view 检测）：
// 节点持 binding 声明（自身注册 / netmap 条目 / 握手对端）向任意副本求证；
// 副本以本地已 apply 状态应答（follower 不重定向——交叉验证正是对 leader 的制衡）
message AuditRequest {
  fixed32 node_id = 1;
  bytes static_pubkey = 2;      // 声明中的公钥（32B）
  bytes binding = 3;            // 声明的绑定签名（64B）
  fixed64 raft_log_index = 4;   // 声明的签发日志锚点
  fixed64 raft_term = 5;
}

message AuditResponse {
  uint32 verdict = 1;           // 0=verified 1=conflict 2=behind 3=unknown(已吊销/无法判定)
  fixed64 applied_index = 2;    // 副本已 apply 日志位（behind 时节点可择机重试）
}
