# mesh docker e2e：direct（coord + node-a/node-b，IPv4 + IPv6 ping）+ relay（a—b—c 线形，经 b 中继）
# PR 也触发但不设 required（低频成本换 mesh 改动提前断裂发现）；场景目录约定见 docs/ci/README.md §1
name: e2e-mesh

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  mesh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: mesh e2e (direct)
        env:
          # runner 的 /etc/resolv.conf 仅 systemd-resolved stub，容器内不可达，须显式公共 DNS
          MESH_E2E_DNS: 1.1.1.1
        run: ./e2e/run_e2e.sh
      - name: mesh e2e (relay)
        env:
          MESH_E2E_DNS: 1.1.1.1
          MESH_E2E_SCENARIO: relay
        run: ./e2e/run_e2e.sh
