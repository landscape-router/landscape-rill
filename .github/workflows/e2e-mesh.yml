# mesh docker e2e：direct（coord + node-a/node-b，IPv4 + IPv6 ping）+ relay（a—b—c 线形，经 b 中继）
# + persist（coord 持久化重启恢复，REQ-037）+ log（日志治理，REQ-039）+ reload（SIGHUP 重载，REQ-038）
# build job 编译一次：编译 cache（~/.cargo + target，内容键，失效时机确定）加速增量编译 →
# release 二进制进 artifact → matrix 场景 job 下载二进制（E2E_SKIP_BUILD=1）不再编译。
# PR 也触发但不设 required；场景目录约定见 docs/ci/README.md §1
name: e2e-mesh

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: rustc version
        id: rustc
        run: echo "version=$(rustc --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - name: iso week
        id: week
        run: echo "iso=$(date +%G-%V)" >> "$GITHUB_OUTPUT"
      # 编译 cache 内容键（失效时机确定，无回退）：Cargo.lock 变更、rustc 版本变更或周旋转（%G-%V，
      # 缓存寿命严格 ≤7 天，即使持续访问；旧条目由 GitHub 内置 7 天未访问规则回收）→ 失效；
      # 源码变更不失效（cargo 指纹保证增量重编正确性）；同键已存在时 save 为 no-op
      - name: Restore cargo cache
        id: cargo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo
            target
          key: cargo-${{ runner.os }}-${{ steps.rustc.outputs.version }}-${{ steps.week.outputs.iso }}-${{ hashFiles('**/Cargo.lock') }}
      - name: release build
        run: cargo build --release
      # GitHub cache 不可覆盖：内容键命中时跳过 save（条目已存在，内容有效）；
      # 仅在键不存在（首次/失效后）时写入新条目
      - name: Save cargo cache
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo
            target
          key: cargo-${{ runner.os }}-${{ steps.rustc.outputs.version }}-${{ steps.week.outputs.iso }}-${{ hashFiles('**/Cargo.lock') }}
      - uses: actions/upload-artifact@v4
        with:
          name: lrill
          path: target/release/lrill
          retention-days: 1

  mesh:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario: [direct, relay, persist, log, reload]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lrill
          # 注意：setup.sh 开头 cleanup 会清 build/，产物须放 .cache/（cleanup 不碰）
          path: e2e/.cache
      - name: mesh e2e (${{ matrix.scenario }})
        env:
          # runner 的 /etc/resolv.conf 仅 systemd-resolved stub，容器内不可达，须显式公共 DNS
          MESH_E2E_DNS: 1.1.1.1
          MESH_E2E_SCENARIO: ${{ matrix.scenario }}
          E2E_SKIP_BUILD: "1"
        run: ./e2e/run_e2e.sh
