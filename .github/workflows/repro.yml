# REQ-050 可复现构建验收：同 commit 双构建哈希比对 + 产物（dist/）+ AO-06 二进制外连审计。
# 仅 main 触发（两次 release 构建成本高，不进 PR 门禁；PR 侧由 check.yml 覆盖）
name: repro

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: double build + hash compare
        run: ./scripts/verify-repro.sh
      - name: mismatch diagnostics
        if: failure()
        run: |
          A=target/repro-a/release/lrill
          B=target/repro-b/release/lrill
          ls -la "$A" "$B"
          echo "--- first differing bytes:"
          cmp -l "$A" "$B" | head -10 || true
          echo "--- differing byte count:"
          cmp -l "$A" "$B" | wc -l || true
          echo "--- target-dir path leaks:"
          strings -a "$A" | grep -c "repro-a" || true
          strings -a "$B" | grep -c "repro-b" || true
          echo "--- section hashes:"
          for s in .text .rodata .symtab; do
            ha=$(objdump -s -j "$s" "$A" 2>/dev/null | sha256sum | cut -c1-10)
            hb=$(objdump -s -j "$s" "$B" 2>/dev/null | sha256sum | cut -c1-10)
            echo "$s A=$ha B=$hb"
          done
      - name: binary hardcoded-domain audit (AO-06)
        run: ./scripts/audit-binary.sh target/repro-a/release/lrill
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: repro-mismatch
          path: |
            target/repro-a/release/lrill
            target/repro-b/release/lrill
