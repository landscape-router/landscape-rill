[package]
name = "landscape-rill-coord"
version.workspace = true
edition.workspace = true
description = "mesh coordinator: registry, identity binding signer/verifier"

[dependencies]
landscape-rill-core = { path = "../rill-core" }
ed25519-dalek.workspace = true
hmac.workspace = true
sha2.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
redb.workspace = true
tracing.workspace = true
thiserror.workspace = true
landscape-rill-macro = { path = "../rill-macro" }
# REQ-070：serde = 数据类型可序列化；storage-v2 = RaftLogStorage/RaftStateMachine
# v2 trait；generic-snapshot-data = SnapshotData 可用 Vec<u8>（整快照字节）
openraft = { version = "0.9.25", features = ["serde", "storage-v2", "generic-snapshot-data"] }

[dev-dependencies]
tokio.workspace = true
