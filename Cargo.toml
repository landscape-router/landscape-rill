[workspace]
members = ["rill-core", "rill-coord", "rill-mesh", "rill-node", "rill-proto", "rill-macro", "rill-dn42", "rill-ts2021", "rilld"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "LGPL-3.0-only"

[workspace.dependencies]

# --- Crypto & protocol primitives ---
quick-protobuf = "0.8.1"
sha2 = "0.11.0"
hmac = "0.13.0"
hkdf = "0.13.0"
chacha20poly1305 = "0.11.0"
snow = { version = "0.10.0", features = ["risky-raw-split"] }
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
ed25519-dalek = "2.2.0"
rand = "0.10.2"

# --- dn42 leg (DN42_LEG) ---
boringtun = "0.7.1"
smoltcp = { version = "0.14.0", default-features = false, features = [
    "std",
    "medium-ip",
    "proto-ipv4",
    "proto-ipv6",
    "socket-tcp",
] }

# --- TLS transport ---
rustls = { version = "0.23.43", default-features = false, features = [
    "ring",
    "logging",
    "std",
    "tls12",
] }
tokio-rustls = { version = "0.26.4", default-features = false, features = [
    "ring",
    "logging",
    "tls12",
] }
rustls-pki-types = "1.15.1"

# --- Async runtime ---
tokio = { version = "1.53.1", features = [
    "rt",
    "rt-multi-thread",
    "net",
    "time",
    "macros",
    "sync",
    "io-util",
    "signal",
] }
bytes = "1.12.1"

# --- Networking & system ---
tun = { version = "0.8.1", features = ["async"] }
rtnetlink = "0.21.0"
netlink-packet-route = "0.30.0"
futures-util = { version = "0.3.33", default-features = false }

# --- CLI & serialization ---
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# --- HTTP (REQ-051 状态端点；观察面属运维基线，依赖豁免见 CONTROL_PLANE §3.14) ---
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }

# --- ts2021 leg (TS2021_LEG)：HTTP/2 会话层 + tailcfg JSON ---
h2 = "0.4"
http = "1"

# --- Error handling (ERROR_ID) ---
thiserror = "2.0"

# --- Wire-format views (rill-core frame/probe, FRAME_HEADER §2.1) ---
zerocopy = { version = "0.8", features = ["derive"] }

# --- Error derive macro (rill-macro) ---
syn = { version = "2.0", features = ["full"] }
quote = "1.0"
proc-macro2 = "1.0"

# --- Logging (LOGGING) ---
tracing = "0.1.41"
tracing-core = "0.1.33"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
tracing-appender = "0.2.3"

# --- Test helpers ---
rcgen = "0.14.8"

# --- Benchmark (dev-only, docs/perf.md) ---
criterion = "0.5"

# --- Build tools ---
pb-rs = "0.10.0"
walkdir = "2.5.0"
redb = "4.2.0"
