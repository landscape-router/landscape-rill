[workspace]
members = ["rill-core", "rill-coord", "rill-mesh", "rill-node", "rill-proto", "rill-macro", "rilld"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "LGPL-3.0-only"

[workspace.dependencies]

# --- Crypto & protocol primitives ---
quick-protobuf = "0.8.1"
sha2 = "0.11.0"
hmac = "0.13.0"
hkdf = "0.13.0"
chacha20poly1305 = "0.11.0"
snow = { version = "0.10.0", features = ["risky-raw-split"] }
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
ed25519-dalek = "2.2.0"
rand = "0.10.2"

# --- TLS transport ---
rustls = { version = "0.23.43", default-features = false, features = [
    "ring",
    "logging",
    "std",
    "tls12",
] }
tokio-rustls = { version = "0.26.4", default-features = false, features = [
    "ring",
    "logging",
    "tls12",
] }
rustls-pki-types = "1.15.1"

# --- Async runtime ---
tokio = { version = "1.53.1", features = [
    "rt",
    "rt-multi-thread",
    "net",
    "time",
    "macros",
    "sync",
    "io-util",
    "signal",
] }
bytes = "1.12.1"

# --- Networking & system ---
tun = { version = "0.8.1", features = ["async"] }
rtnetlink = "0.21.0"
netlink-packet-route = "0.30.0"
futures-util = { version = "0.3.33", default-features = false }

# --- CLI & serialization ---
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# --- Error handling (ERROR_ID) ---
thiserror = "2.0"

# --- Error derive macro (rill-macro) ---
syn = { version = "2.0", features = ["full"] }
quote = "1.0"
proc-macro2 = "1.0"

# --- Logging (LOGGING) ---
tracing = "0.1.41"
tracing-core = "0.1.33"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
tracing-appender = "0.2.3"

# --- Test helpers ---
rcgen = "0.14.8"

# --- Build tools ---
pb-rs = "0.10.0"
walkdir = "2.5.0"
redb = "4.2.0"
